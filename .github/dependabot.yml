version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait for a release to age before proposing it, so yanked or
    # compromised releases are usually caught upstream first.
    # Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      # All minor/patch bumps in one PR; majors stay separate so one
      # breaking upgrade doesn't hold back the rest.
      pip-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "Django"
        versions: [">=7.0"]

  # The workflow actions are pinned by commit SHA; this keeps the pins
  # current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
